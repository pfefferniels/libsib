[package]
name = "libsib"
version = "0.1.0"
edition = "2024"
description = "Reader and writer for Sibelius .sib score files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pfefferniels/libsib"
readme = "README.md"
keywords = ["sibelius", "music", "notation", "score", "file-format"]
categories = ["parser-implementations", "encoding"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
thiserror = "2"
